<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="35%" stop-color="#14b8a6" />
      <stop offset="70%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <radialGradient id="topGlow" cx="25%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#042f2e" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#042f2e" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Full Bleed Background for iOS & Store requirements -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />
  <rect width="1024" height="1024" fill="url(#topGlow)" />

  <!-- Subtle Ambient Vignette / Edge Depth -->
  <rect width="1024" height="1024" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" />

  <!-- Crisp White Division Symbol ÷ -->
  <g fill="#ffffff" filter="url(#symbolShadow)">
    <!-- Top Dot -->
    <circle cx="512" cy="296" r="76" />
    <!-- Divider Bar -->
    <rect x="248" y="468" width="528" height="88" rx="44" />
    <!-- Bottom Dot -->
    <circle cx="512" cy="728" r="76" />
  </g>
</svg>
