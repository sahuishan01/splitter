<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="roundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="40%" stop-color="#14b8a6" />
      <stop offset="75%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <radialGradient id="roundGlow" cx="25%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="roundShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="256" fill="url(#roundGrad)" />
  <circle cx="256" cy="256" r="256" fill="url(#roundGlow)" />
  <circle cx="256" cy="256" r="254" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" />

  <!-- Division Symbol ÷ -->
  <g fill="#ffffff" filter="url(#roundShadow)">
    <circle cx="256" cy="148" r="38" />
    <rect x="124" y="234" width="264" height="44" rx="22" />
    <circle cx="256" cy="364" r="38" />
  </g>
</svg>
