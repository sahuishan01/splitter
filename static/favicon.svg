<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="splitterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3aa"/>
      <stop offset="60%" stop-color="#1cc29f"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#splitterGrad)"/>
  
  <!-- Subtle inner highlight / depth -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>
  
  <!-- Division Sign ÷ in Crisp White -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Top Dot -->
    <circle cx="256" cy="140" r="44"/>
    <!-- Divider Bar -->
    <rect x="126" y="234" width="260" height="44" rx="22"/>
    <!-- Bottom Dot -->
    <circle cx="256" cy="372" r="44"/>
  </g>
</svg>
